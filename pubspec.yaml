name: habit_game
description: "تطبيق تتبع العادات واللياقة البدنية"
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  fl_chart: ^0.70.2
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  local_auth: ^2.3.0
  uuid: ^4.5.1
  path: ^1.9.1
  google_fonts: ^6.2.1
  home_widget: ^0.7.0
  health: ^13.3.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  tutorial_coach_mark: ^1.2.12
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dependency_overrides:
  device_info_plus: 11.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6

flutter_native_splash:
  color: "#000000"
  image: images/splash/Healthy_lifestyle_fitness_icon-removebg-preview.png
  color_dark: "#000000"
  image_dark: images/splash/Healthy_lifestyle_fitness_icon-removebg-preview.png
  android_12:
    color: "#000000"
    image: images/splash/Healthy_lifestyle_fitness_icon-removebg-preview.png
    color_dark: "#000000"
    image_dark: images/splash/Healthy_lifestyle_fitness_icon-removebg-preview.png
  ios: true
  android: true

flutter:
  uses-material-design: true
  assets:
    - images/splash/
